<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seamless MP4 Multi-Camera Recorder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #liveVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
            display: none; 
            pointer-events: none;
            z-index: 5;
        }

        .mirrored { transform: scaleX(-1); }

        .controls-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 1.2rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            z-index: 10;
            transition: opacity 0.4s ease;
            width: 90%;
            max-width: 500px;
        }

        .button-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s, transform 0.1s;
        }

        button:active:not(:disabled) { transform: scale(0.95); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        #startBtn { background-color: #4CAF50; color: white; }
        #pauseBtn { background-color: #FFC107; color: black; }
        #stopBtn { background-color: #F44336; color: white; }
        #downloadBtn { background-color: #2196F3; color: white; }
        #mirrorBtn { background-color: #ffffff; color: #000; }
        #switchCamBtn { background-color: #9C27B0; color: white; }

        .status {
            font-size: 0.9rem;
            color: #ffffff;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Playsinline is critical for iOS -->
        <video id="liveVideo" autoplay playsinline muted></video>
        <!-- Overlay Canvas is now ONLY used for the ghosting/pause effect -->
        <canvas id="overlayCanvas"></canvas>
        
        <div id="controlsOverlay" class="controls-overlay">
            <div class="status" id="statusText">Camera ready.</div>
            <div class="button-group">
                <button id="switchCamBtn">Switch Cam</button>
                <button id="mirrorBtn">Flip View</button>
                <button id="startBtn">Start</button>
                <button id="pauseBtn" disabled>Pause</button>
                <button id="stopBtn" disabled>Stop</button>
                <button id="downloadBtn" disabled>Save/Share</button>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('liveVideo');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const oCtx = overlayCanvas.getContext('2d');
        
        const controlsOverlay = document.getElementById('controlsOverlay');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const mirrorBtn = document.getElementById('mirrorBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const statusText = document.getElementById('statusText');

        let mediaRecorder;
        let recordedChunks = [];
        let stream; // We now record the raw stream directly!
        let finalBlob = null;
        let hideTimeout;
        let currentFacingMode = "user"; 
        let isLiveViewMirrored = false; 

        function stopCurrentCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
        }

        async function initCamera() {
            stopCurrentCamera();
            try {
                // Get the raw audio/video stream from the hardware
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: currentFacingMode }, 
                    audio: true 
                });
                videoElement.srcObject = stream;

                videoElement.onloadedmetadata = () => {
                    overlayCanvas.width = videoElement.videoWidth;
                    overlayCanvas.height = videoElement.videoHeight;

                    // Automatically mirror the LIVE preview for front camera (like a real mirror)
                    if (currentFacingMode === "user") {
                        isLiveViewMirrored = true;
                        videoElement.classList.add('mirrored');
                    } else {
                        isLiveViewMirrored = false;
                        videoElement.classList.remove('mirrored');
                    }

                    statusText.innerText = `Camera ready (${currentFacingMode === 'user' ? 'Front' : 'Rear'}).`;
                };
            } catch (err) {
                statusText.innerText = "Camera access denied.";
            }
        }

        switchCamBtn.addEventListener('click', () => {
            switchCamBtn.disabled = true;
            statusText.innerText = "Switching cameras...";
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            initCamera().then(() => { switchCamBtn.disabled = false; });
        });

        mirrorBtn.addEventListener('click', () => {
            isLiveViewMirrored = !isLiveViewMirrored;
            if (isLiveViewMirrored) {
                videoElement.classList.add('mirrored');
            } else {
                videoElement.classList.remove('mirrored');
            }
        });

        startBtn.addEventListener('click', () => {
            finalBlob = null;
            recordedChunks = [];
            
            // Ask for MP4 natively. If the browser doesn't support the string, pass nothing.
            // iOS Safari will naturally default to MP4 when options are empty.
            let options = {};
            if (MediaRecorder.isTypeSupported('video/mp4')) {
                options = { mimeType: 'video/mp4' };
            }

            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream); // Ultimate fallback
            }

            mediaRecorder.ondataavailable = (e) => { 
                if (e.data.size > 0) recordedChunks.push(e.data); 
            };

            mediaRecorder.onstop = () => {
                // Determine actual mime type. Safari often leaves it blank, meaning MP4.
                let type = mediaRecorder.mimeType || 'video/mp4';
                finalBlob = new Blob(recordedChunks, { type: type });
                
                downloadBtn.disabled = false;
                startBtn.disabled = false;
                startBtn.innerText = "Re-Record";
                statusText.innerText = "Ready to save!";
                resetUIHideTimer();
            };

            mediaRecorder.start();

            startBtn.disabled = true;
            pauseBtn.disabled = false;
            stopBtn.disabled = false;
            downloadBtn.disabled = true;
            statusText.innerText = "Recording...";
            statusText.style.color = "#4CAF50";
            resetUIHideTimer();
        });

        pauseBtn.addEventListener('click', () => {
            if (mediaRecorder.state === 'recording') {
                // Take a snapshot of the current frame for the "ghosting" overlay
                oCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                if (isLiveViewMirrored) {
                    oCtx.save();
                    oCtx.translate(overlayCanvas.width, 0);
                    oCtx.scale(-1, 1);
                    oCtx.drawImage(videoElement, 0, 0, overlayCanvas.width, overlayCanvas.height);
                    oCtx.restore();
                } else {
                    oCtx.drawImage(videoElement, 0, 0, overlayCanvas.width, overlayCanvas.height);
                }
                
                overlayCanvas.style.display = 'block';
                mediaRecorder.pause();
                
                pauseBtn.innerText = "Resume";
                statusText.innerText = "Paused. Align your shot.";
                statusText.style.color = "#FFC107";
                
            } else if (mediaRecorder.state === 'paused') {
                overlayCanvas.style.display = 'none';
                mediaRecorder.resume();
                
                pauseBtn.innerText = "Pause";
                statusText.innerText = "Recording...";
                statusText.style.color = "#4CAF50";
            }
            resetUIHideTimer();
        });

        stopBtn.addEventListener('click', () => {
            mediaRecorder.stop();
            overlayCanvas.style.display = 'none';
            pauseBtn.disabled = true;
            pauseBtn.innerText = "Pause";
            stopBtn.disabled = true;
        });

        downloadBtn.addEventListener('click', async () => {
            if (!finalBlob) return;
            
            // If the blob type contains webm (Android), use webm. Otherwise, force mp4 (iOS/Safari).
            const isWebm = finalBlob.type.includes('webm');
            const ext = isWebm ? 'webm' : 'mp4';
            const fileMime = isWebm ? 'video/webm' : 'video/mp4';
            const filename = `recording-${Date.now()}.${ext}`;
            
            // Create a strictly typed File object for the Share Sheet
            const file = new File([finalBlob], filename, { type: fileMime });

            // 1. Try Native Mobile Share Sheet (iOS "Save to Files" or "Save Video")
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Video Recording',
                    });
                    statusText.innerText = "Shared successfully!";
                    statusText.style.color = "#2196F3";
                    return; 
                } catch (error) {
                    console.log('Share canceled or failed', error);
                }
            } 
            
            // 2. Fallback to Direct Download
            const url = window.URL.createObjectURL(file);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = filename; 
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            
            statusText.innerText = `Saved as ${ext.toUpperCase()}!`;
            statusText.style.color = "#2196F3";
        });

        function resetUIHideTimer() {
            controlsOverlay.style.opacity = '1';
            controlsOverlay.style.pointerEvents = 'auto';
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    controlsOverlay.style.opacity = '0';
                    controlsOverlay.style.pointerEvents = 'none';
                }
            }, 3000);
        }

        window.addEventListener('mousemove', resetUIHideTimer);
        window.addEventListener('touchstart', resetUIHideTimer);

        initCamera();
        resetUIHideTimer();
    </script>
</body>
</html>
